name: Frontend CI

on:
  push:
    branches:
      - version-4.0.0
      - "feature/**"
  pull_request:
    branches:
      - version-4.0.0
      - "feature/**"

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          BACKEND_API_URL: http://127.0.0.1:8000

      - name: Unit tests (Vitest)
        run: npm test
