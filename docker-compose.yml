version: "3.9"

# LOCAL DEVELOPMENT ONLY.
# Default credentials below (postgres/postgres, minioadmin/minioadmin) must NEVER
# be used in production. When APP_ENV/ENVIRONMENT=production, the backend refuses
# to start with these defaults.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: previsit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: previsit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio
    container_name: previsit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-createbucket:
    image: minio/mc
    container_name: previsit-minio-createbucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/previsit-files --ignore-existing &&
      exit 0
      "

  ollama:
    image: ollama/ollama:latest
    container_name: previsit_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: previsit-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    env_file:
      - ./backend/.env.example
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: previsit
      APP_ENV: production
      CORS_ORIGINS: http://localhost:3000
      OLLAMA_HOST: http://ollama:11434
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_NAME: previsit-files
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: previsit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000
      NEXT_PUBLIC_APP_NAME: PreVisit MVP
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
  ollama_data:
