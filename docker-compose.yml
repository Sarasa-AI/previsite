version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: previsit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: previsit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: previsit-backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/previsit
      APP_ENV: production
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: previsit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000
      NEXT_PUBLIC_APP_NAME: PreVisit MVP
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
